name: Refresh video and deck showcases
on:
  push:
    branches: [main]
    paths:
      - 'update_showcases.py'
      - '.github/workflows/refresh-showcases.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube fallback fetcher
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Fetch public showcase data
        run: python update_showcases.py
      - name: Commit changed showcase data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showcase-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public showcase data'
            git push
          fi
