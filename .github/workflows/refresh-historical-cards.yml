name: Refresh Historical Commander Gallery
on:
  push:
    branches: [main]
    paths:
      - 'sync_historical_cards.py'
      - '.github/workflows/refresh-historical-cards.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public folder downloader
        run: pip install 'gdown>=5.2,<6'
      - name: Download public historical cards
        run: python sync_historical_cards.py
      - name: Publish gallery changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical-cards historical-cards.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync public Historical Commander gallery"
            git push
          fi
